# Host nginx (443) — example. Install on each VPS.
# landing: proxy_pass http://127.0.0.1:ACTIVE
# api: same + location /p/

server {
  listen 80;
  server_name pokazo.ru www.pokazo.ru api.pokazo.ru;
  location / {
    proxy_pass http://pokazo_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }
}
