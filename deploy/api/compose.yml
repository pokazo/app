services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokazo
      POSTGRES_PASSWORD: pokazo
      POSTGRES_DB: pokazo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - /var/lib/pokazo/pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:56379:6379"
