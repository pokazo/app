# Egress for pokazo-api on 80.87.196.33 (Unsplash times out from that IP).
# Search:  :8788 → api.unsplash.com
# Images:  :8789 → images.unsplash.com
server {
    listen 8788;
    server_name _;
    allow 80.87.196.33;
    allow 127.0.0.1;
    deny all;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    resolver 127.0.0.53 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $unsplash_api api.unsplash.com;
        proxy_pass https://$unsplash_api$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name api.unsplash.com;
        proxy_set_header Host api.unsplash.com;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8789;
    server_name _;
    allow 80.87.196.33;
    allow 127.0.0.1;
    deny all;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    resolver 127.0.0.53 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $unsplash_img images.unsplash.com;
        proxy_pass https://$unsplash_img$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name images.unsplash.com;
        proxy_set_header Host images.unsplash.com;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
    }
}
