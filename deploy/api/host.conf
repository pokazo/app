# upstream pokazo_app comes from /etc/nginx/conf.d/pokazo-upstream.conf

server {
  listen 80;
  listen [::]:80;
  server_name api.pokazo.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.pokazo.ru;
  ssl_certificate /etc/letsencrypt/live/api.pokazo.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.pokazo.ru/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 8m;

  location / {
    proxy_pass http://pokazo_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }
}
