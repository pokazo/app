server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location = /robots.txt {
    default_type text/plain;
  }

  location = /sitemap.xml {
    default_type application/xml;
  }

  # IndexNow key file
  location ~ ^/[0-9a-f]{32}\.txt$ {
    default_type text/plain;
  }

  location ^~ /legal/ {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Client app routes — empty SPA shell (not the prerendered landing)
  location ~ ^/(app|login|copy-code|view)(/|$) {
    try_files /shell.html =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Real files + `/` via index.html. No SPA fallback → no soft-404.
  location / {
    try_files $uri $uri/ =404;
  }
}
