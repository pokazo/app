server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location = /robots.txt {
    default_type text/plain;
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files /sitemap.xml =404;
  }

  # IndexNow key file
  location ~ ^/[0-9a-f]{32}\.txt$ {
    default_type text/plain;
    try_files $uri =404;
  }

  location = / {
    try_files /index.html =404;
  }

  location ^~ /legal/ {
    index index.html;
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Client app routes — empty SPA shell (not the prerendered landing)
  location ~ ^/(app|login|copy-code|view)(/|$) {
    try_files /shell.html =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri =404;
  }
}
