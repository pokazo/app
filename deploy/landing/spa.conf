server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location = /robots.txt {
    default_type text/plain;
  }

  location = /sitemap.xml {
    default_type application/xml;
  }

  # IndexNow key (exact match — avoid nginx {n} regex quoting pitfalls)
  location = /08707910eccd89cc15a79a4bc7d77e88.txt {
    default_type text/plain;
  }

  # Trailing slash → slashless canonical (sitemap and rel=canonical have no slash).
  # These regexes must come before the slashless try_files: nginx uses first match.
  location ~ ^/(urok|doklad|shkola|studenty|biznes|pricing|contact)/$ {
    return 301 /$1$is_args$args;
  }

  location ~ ^/legal/([^/]+)/$ {
    return 301 /legal/$1$is_args$args;
  }

  location ~ ^/legal/([^/]+)$ {
    try_files /legal/$1/index.html =404;
  }

  location ~ ^/(urok|doklad|shkola|studenty|biznes|pricing|contact)$ {
    try_files /$1/index.html =404;
  }

  # Client app routes — empty SPA shell (not the prerendered landing)
  location ~ ^/(app|login|copy-code|view)(/|$) {
    try_files /shell.html =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Real files + `/` via index.html. No SPA fallback → no soft-404.
  location / {
    try_files $uri $uri/ =404;
  }
}
